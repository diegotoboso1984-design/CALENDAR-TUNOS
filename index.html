                  const eY = d.getFullYear(); const eM = String(d.getMonth()+1).padStart(2,'0'); const eD = String(d.getDate()).padStart(2,'0');
                  const eH = String(d.getHours()).padStart(2,'0'); const em = String(d.getMinutes()).padStart(2,'0');
                  icsContent += `DTEND:${eY}${eM}${eD}T${eH}${em}00\n`;
              } else {
                  const icsDate = dateParts.join('');
                  let d = new Date(dateParts[0], dateParts[1]-1, dateParts[2]);
                  d.setDate(d.getDate() + 1);
                  const icsEnd = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
                  icsContent += `DTSTART;VALUE=DATE:${icsDate}\n`;
                  icsContent += `DTEND;VALUE=DATE:${icsEnd}\n`;
              }
              icsContent += `SUMMARY:${ev.title}\n`;
              icsContent += "END:VEVENT\n";
          });
      }
      icsContent += "END:VCALENDAR";

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'turnos_y_eventos.ics';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
  }

  function importICS(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
          const content = e.target.result;
          const events = content.split('BEGIN:VEVENT');
          let importedCount = 0;

          for (let i = 1; i < events.length; i++) {
              const evStr = events[i];
              const summaryMatch = evStr.match(/SUMMARY:(.*)/);
              const dtStartMatch = evStr.match(/DTSTART(?:;.*?)?:(.*)/);

              if (summaryMatch && dtStartMatch) {
                  let summary = summaryMatch[1].trim();
                  const dtStart = dtStartMatch[1].trim();

                  let year, month, day, time = '';
                  if (dtStart.length >= 8) {
                      year = dtStart.substring(0, 4);
                      month = dtStart.substring(4, 6);
                      day = dtStart.substring(6, 8);
                      
                      if (dtStart.includes('T') && dtStart.length >= 15) {
                          const tIndex = dtStart.indexOf('T');
                          const hh = dtStart.substring(tIndex+1, tIndex+3);
                          const mm = dtStart.substring(tIndex+3, tIndex+5);
                          time = `${hh}:${mm}`;
                      }
                      
                      if (summary.startsWith("[Turno]")) continue;

                      const dateStr = `${year}-${month}-${day}`;
                      
                      if (!calEvents[dateStr]) calEvents[dateStr] = [];
                      calEvents[dateStr].push({
                          id: Date.now() + Math.random(),
                          title: summary,
                          time: time,
                          alarmOffset: 0,
                          notified: false
                      });
                      importedCount++;
                  }
              }
          }
          saveData();
          if(currentView === 'month') renderCalendar();
          alert(`Se han importado ${importedCount} eventos correctamente.`);
      };
      reader.readAsText(file);
      event.target.value = ''; 
  }

  function addEvent() {
      const dateStr = formatDateStr(selectedDay);
      const title = document.getElementById('ev-title').value.trim();
      const time = document.getElementById('ev-time').value;
      const alarmOffset = parseFloat(document.getElementById('ev-alarm').value);
      if (!title) return alert("El título del evento es obligatorio.");
      if (!calEvents[dateStr]) calEvents[dateStr] = [];
      calEvents[dateStr].push({ id: Date.now(), title, time, alarmOffset, notified: false });
      saveData();
      
      if (alarmOffset > 0 && "Notification" in window && Notification.permission !== "granted") {
          Notification.requestPermission();
      }
      document.getElementById('ev-title').value = ''; document.getElementById('ev-time').value = ''; document.getElementById('ev-alarm').value = '0';
      
      renderDayModalContent();
      renderCalendar();
  }

  function deleteEvent(dateStr, id) {
      if(confirm('¿Eliminar esta cita?')) {
          calEvents[dateStr] = calEvents[dateStr].filter(e => e.id !== id);
          if (calEvents[dateStr].length === 0) delete calEvents[dateStr];
          saveData(); 
          renderDayModalContent();
          renderCalendar();
      }
  }

  function clearCalendar() {
      if(confirm('⚠️ ¿Estás seguro de que quieres BORRAR TODOS los turnos y eventos asignados en tu calendario? Esta acción no se puede deshacer.')) {
          assignedShifts = {};
          calEvents = {};
          saveData();
          renderCalendar();
          closeConfig();
          alert("Calendario limpiado correctamente.");
      }
  }

  function toggleShiftOnDate(dateStr) {
    if (!activeShiftId) return;
    if (!assignedShifts[dateStr]) assignedShifts[dateStr] = [];
    if (activeShiftId === 'eraser') {
        assignedShifts[dateStr].pop(); 
        if (assignedShifts[dateStr].length === 0) delete assignedShifts[dateStr];
    } else {
        if (!assignedShifts[dateStr].includes(activeShiftId)) { assignedShifts[dateStr].push(activeShiftId); } 
        else {
            assignedShifts[dateStr] = assignedShifts[dateStr].filter(id => id !== activeShiftId);
            if (assignedShifts[dateStr].length === 0) delete assignedShifts[dateStr];
        }
    }
    saveData();
    if(currentView === 'month') renderCalendar();
    
    if (document.getElementById('day-modal').classList.contains('active')) {
        renderDayModalContent();
    }
  }

  let touchStartX = 0; let touchEndX = 0;
  const mainApp = document.getElementById('app');

  mainApp.addEventListener('touchstart', e => {
      if(e.target.closest('.bottom-bar') || e.target.closest('.modal') || e.target.closest('.year-picker')) return;
      touchStartX = e.changedTouches[0].screenX;
  }, {passive: true});

  mainApp.addEventListener('touchend', e => {
      if(e.target.closest('.bottom-bar') || e.target.closest('.modal') || e.target.closest('.year-picker')) return;
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
  }, {passive: true});

  function handleSwipe() {
      if (currentView !== 'month') return; 
      const swipeThreshold = 50;
      if (touchStartX - touchEndX > swipeThreshold) { nextPeriod(); } 
      else if (touchEndX - touchStartX > swipeThreshold) { prevPeriod(); }
  }

  let isScrolling = false;
  mainApp.addEventListener('wheel', e => {
      if(e.target.closest('.bottom-bar') || e.target.closest('.modal') || e.target.closest('.year-picker')) return;
      if (currentView !== 'month') return;
      if (!isScrolling) {
          if (e.deltaX > 30 || e.deltaY > 30) {
              nextPeriod(); isScrolling = true; setTimeout(() => isScrolling = false, 500); 
          } else if (e.deltaX < -30 || e.deltaY < -30) {
              prevPeriod(); isScrolling = true; setTimeout(() => isScrolling = false, 500);
          }
      }
  }, {passive: true});

  function openConfig() { document.getElementById('config-modal').classList.add('active'); renderShiftsList(); }
  function closeConfig() { document.getElementById('config-modal').classList.remove('active'); resetForm(); }
  
  function renderShiftsList() {
      const list = document.getElementById('shifts-list');
      list.innerHTML = '';
      shifts.forEach(s => {
          const d = document.createElement('div');
          d.className = 'shift-list-item';
          const abbr = s.emoji || s.name.substring(0,2).toUpperCase();
          d.innerHTML = `
            <div class="shift-list-header">
                <div style="display:flex; align-items:center; gap:10px;">
                  <div style="width:30px; height:30px; background:${s.color}; border-radius:6px; display:flex; justify-content:center; align-items:center; font-size:14px; color:white; font-weight:bold;">${abbr}</div>
                  <strong>${s.name}</strong> 
                  <span style="font-size:13px; color:var(--muted)">${s.timeStart ? '('+s.timeStart+'-'+s.timeEnd+')' : ''}</span>
                </div>
                <div class="shift-actions">
                    <button class="btn-edit" onclick="editShift('${s.id}')">✏️</button>
                    <button class="btn-delete" onclick="deleteShift('${s.id}')">✖</button>
                </div>
            </div>
          `;
          list.appendChild(d);
      });
  }

  function editShift(id) {
      const shift = shifts.find(s => s.id === id);
      if (!shift) return;
      document.getElementById('form-title').textContent = "Editar Turno";
      document.getElementById('edit-shift-id').value = shift.id;
      document.getElementById('new-shift-name').value = shift.name;
      document.getElementById('new-shift-color').value = shift.color;
      document.getElementById('new-shift-emoji').value = shift.emoji || '';
      document.getElementById('new-shift-start').value = shift.timeStart || '';
      document.getElementById('new-shift-end').value = shift.timeEnd || '';
      document.getElementById('btn-cancel-edit').style.display = 'block';
  }
  
  function resetForm() {
      document.getElementById('form-title').textContent = "Añadir Nuevo Turno";
      document.getElementById('edit-shift-id').value = "";
      document.getElementById('new-shift-name').value = "";
      document.getElementById('new-shift-color').value = "#4ade80";
      document.getElementById('new-shift-emoji').value = "";
      document.getElementById('new-shift-start').value = "";
      document.getElementById('new-shift-end').value = "";
      document.getElementById('btn-cancel-edit').style.display = 'none';
  }

  function saveShift() {
    const idToEdit = document.getElementById('edit-shift-id').value;
    const name = document.getElementById('new-shift-name').value.trim();
    const color = document.getElementById('new-shift-color').value;
    const emoji = document.getElementById('new-shift-emoji').value.trim();
    const timeStart = document.getElementById('new-shift-start').value;
    const timeEnd = document.getElementById('new-shift-end').value;

    if (!name) return alert('Por favor, indica un nombre para el estado.');

    if (idToEdit) {
        const index = shifts.findIndex(s => s.id === idToEdit);
        if (index !== -1) { shifts[index] = { id: idToEdit, name, color, emoji, timeStart, timeEnd }; }
    } else {
        shifts.push({ id: 's' + Date.now().toString(), name, color, emoji, timeStart, timeEnd });
    }
    
    saveData(); resetForm(); renderShiftsList(); renderPalette(); setView(currentView); 
  }

  function deleteShift(id) {
    if(confirm('¿Eliminar este turno permanentemente? Se borrará de los días asignados.')) {
      shifts = shifts.filter(s => s.id !== id);
      for (let date in assignedShifts) {
         assignedShifts[date] = assignedShifts[date].filter(sId => sId !== id);
         if (assignedShifts[date].length === 0) delete assignedShifts[date];
      }
      if (activeShiftId === id) activeShiftId = null;
      saveData(); renderShiftsList(); renderPalette(); setView(currentView);
    }
  }

  updateSeason();
  updateHeader();
  renderPalette();
  
</script>
</body>
</html>
